<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WHOOP подключён</title><style>body{max-width:620px;margin:15vh auto;padding:0 24px;font:18px/1.55 system-ui,sans-serif;color:#24191b}main{border-left:5px solid #74273c;padding-left:22px}</style></head><body><main><h1 id="title">Подключение WHOOP</h1><p id="message">Проверяю результат…</p></main><script>const p=new URLSearchParams(location.search);const m=document.querySelector('#message');if(p.get('error')){document.querySelector('#title').textContent='Подключение не завершено';m.textContent='WHOOP вернул ошибку: '+p.get('error')+'. Вернитесь в чат, и мы разберёмся.'}else if(p.get('code')){document.querySelector('#title').textContent='Разрешение WHOOP получено';m.textContent='Вернитесь в чат и напишите «WHOOP подключён». Не публикуйте и не пересылайте адрес этой страницы: он содержит одноразовый код авторизации.'}else{m.textContent='Откройте эту страницу только после авторизации в WHOOP.'}</script></body></html>
