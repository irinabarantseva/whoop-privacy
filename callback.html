<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WHOOP подключён</title><style>body{max-width:620px;margin:10vh auto;padding:0 24px;font:18px/1.55 system-ui,sans-serif;color:#24191b}main{border-left:5px solid #74273c;padding-left:22px}textarea{width:100%;min-height:92px;font:14px ui-monospace,monospace;padding:10px;box-sizing:border-box}button{margin-top:10px;padding:11px 14px;border:0;border-radius:6px;background:#74273c;color:#fff;font:inherit}</style></head><body><main><h1 id="title">Подключение WHOOP</h1><p id="message">Проверяю результат…</p><textarea id="code" readonly hidden></textarea><button id="copy" hidden>Скопировать код</button></main><script>const p=new URLSearchParams(location.search),m=document.querySelector('#message'),box=document.querySelector('#code'),b=document.querySelector('#copy');if(p.get('error')){document.querySelector('#title').textContent='Подключение не завершено';m.textContent='WHOOP вернул ошибку: '+p.get('error')+'. Вернитесь в чат, и мы разберёмся.'}else if(p.get('code')){document.querySelector('#title').textContent='Разрешение WHOOP получено';m.textContent='Скопируйте одноразовый код ниже и вставьте его только в приватный workflow Connect WHOOP account. Не отправляйте код в чат.';box.hidden=false;b.hidden=false;box.value=p.get('code');b.onclick=async()=>{await navigator.clipboard.writeText(box.value);b.textContent='Скопировано'};}else{m.textContent='Откройте эту страницу только после авторизации в WHOOP.'}</script></body></html>
